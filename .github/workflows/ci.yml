# ac3forge CI.
#
# ---------------------------------------------------------------------------
# Matrix status (updated when linux-gcc/linux-llvm picked up the GUI, merged
# with the ALSA audio backend that landed on develop in the meantime)
# ---------------------------------------------------------------------------
# linux-gcc and linux-llvm were run for real by this merge itself: fresh
# configure + build + full ctest on WSL2 Ubuntu 26.04 (gcc 15.2.0 / clang
# 21.1.8) with both the GUI and ALSA present together - the exact package list
# _build.yml now installs (qt6-base-dev/-tools, qt6-declarative-dev/-tools,
# libasound2-dev) - plus the same leg's no-ALSA-fallback step, plus the
# headless `ac3gui --smoke` command _build.yml runs after Test. None of that
# has gone through an actual GitHub Actions run yet, since this is the first
# push combining the GUI and ALSA work; rows marked GREEN* should be read as
# "confirmed on WSL2, pending this branch's first real CI run" until that run
# lands. windows-msvc/windows-llvm's 256/256 and linux-llvm-asan-ubsan's
# 270/270 are carried over from before this merge (MSVC 14.51 locally, and the
# commit that landed the ALSA backend, respectively) - not re-run here, but
# the 256 baseline is corroborated independently by this merge's own
# no-ALSA-fallback measurement, which landed on the same number.
#
#   leg                     status    notes
#   ----------------------  --------  ------------------------------------------
#   windows-msvc            GREEN     256/256 tests pass
#   windows-llvm             GREEN    256/256 tests pass; fixed a qsizetype-to-int
#                                     narrowing in encoder_controller.cpp that
#                                     -Wconversion rejects under clang-cl (MSVC's
#                                     /W4 has no equivalent check). Not re-run
#                                     for the ALSA change, which touches no
#                                     Windows code - see the note below on why
#                                     the count still moved
#   linux-gcc                GREEN*   270/270 tests incl. GUI and ALSA both,
#                                     plus 256/256 again in the same leg's
#                                     no-ALSA fallback step - see the WSL2 note
#                                     above
#   linux-llvm                GREEN*  270/270 tests incl. GUI and ALSA both -
#                                     see the WSL2 note above
#   linux-llvm-asan-ubsan    GREEN    270/270 tests (as reported when the ALSA
#                                     backend landed; not independently re-run
#                                     for this merge), leak detection on. Still
#                                     CLI-only by design, to keep a Qt kit out
#                                     of the sanitizer leg's install time - see
#                                     _build.yml. The codec-matrix script this
#                                     leg also runs was not re-run either: it
#                                     exercises encode/decode paths, and no
#                                     codec source changed
#   static-analysis (tidy)   GREEN    .clang-tidy's curated set, clean baseline
#   macos-llvm               GREEN    256/256 tests pass (real GitHub Actions
#                                     run, not WSL2/local - this project has
#                                     no Mac). First-ever run hit one genuine,
#                                     fully-understood issue (Homebrew's
#                                     unpinned llvm formula flagging Catch2's
#                                     __COUNTER__ under -Wc2y-extensions - see
#                                     cmake/CompilerWarnings.cmake), fixed in
#                                     one commit, then two consecutive clean
#                                     runs. No longer experimental.
#
# ---------------------------------------------------------------------------
# Gold-reference correctness gate (added alongside the macos-llvm promotion)
# ---------------------------------------------------------------------------
# docs/RESEARCH.md's validation pyramid designed L3 (FFmpeg-oracle strict
# decode, every commit) and L4 (perceptual SNR) from the start; neither was
# ever wired into any CI leg until now. scripts/verify-gold-reference.sh
# encodes a fixed checked-in 5.1 WAV (tests/golden/audio/reference_51.wav),
# strict-decodes it with FFmpeg, decodes it with ac3cli's own decoder, and
# asserts they agree via scripts/compare_wav.py's delay-compensated SNR (>=
# 30 dB gate). Runs on every leg except linux-llvm-asan-ubsan (diagnostic-
# only, same reasoning as its `packageable` exclusion). Real numbers from the
# CI run that landed this: 67.84/67.82 dB on Windows and Linux, 61.81/61.82
# dB on macOS - a real, modest cross-compiler floating-point difference
# (Homebrew LLVM's libm vs. glibc's/MSVC's), comfortably clear of the
# threshold on every leg, and exactly why the gate is SNR-based rather than a
# bit-exact bitstream comparison.
#
# GUI does not gate any ctest entry - it only adds the separate ac3gui build
# target - so the true baseline (no ALSA, GUI on or off, doesn't matter) is
# 256/256 everywhere, confirmed directly by this merge's own linux-gcc
# no-ALSA-fallback run. AC3FORGE_WITH_ALSA's tests/platform/alsa/ (see
# tests/CMakeLists.txt) accounts for the 270-256=14 gap on top of that.
#
# What none of this covers: real audio hardware. WSL2 has no sound devices and
# no kernel sound modules, and neither does a GitHub runner, so the ALSA
# backend is verified headless only. See docs/BUILDING.md#linux-audio.
#
# * Confirmed on WSL2, not yet on an actual GitHub Actions run - see the note
#   above. Drop the asterisk once this branch's CI confirms it there too.
#
# macos-llvm is no longer experimental (see _build.yml's own header for how
# that happened) - it blocks like every other leg now, no continue-on-error.
name: CI

on:
  # Only the long-lived branches build on push; the work happens on topic
  # branches whose pull_request run covers them, so a WIP push does not also run
  # the matrix.
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Enforce the GitFlow branch naming on every PR. A topic branch is
  # <type>/<name> where type is one of feature/release/hotfix/bugfix/support;
  # main and develop are accepted as PR heads so a release-promotion PR
  # (develop -> main) is never blocked, and dependabot/** is accepted because
  # Dependabot's branch names are not configurable. Required on main/develop, so
  # a misnamed branch cannot merge.
  branch-name:
    name: Branch Name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate head branch name
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == "main" ]]; then
            echo "Core branch '$HEAD_REF' - allowed (release promotion)."
            exit 0
          fi
          if [[ "$HEAD_REF" == dependabot/* ]]; then
            echo "Dependabot branch '$HEAD_REF' - allowed (names are not configurable)."
            exit 0
          fi
          pattern='^(feature|release|hotfix|bugfix|support)/[a-z0-9._-]+$'
          if [[ "$HEAD_REF" =~ $pattern ]]; then
            echo "Branch '$HEAD_REF' conforms to <type>/<name>."
            exit 0
          fi
          echo "::error title=Invalid branch name::'$HEAD_REF' must be <type>/<name> where <type> is one of: feature, release, hotfix, bugfix, support (for example feature/eac3-decoder). See CONTRIBUTING.md."
          exit 1

  # The RE-derived EMDF signer is quarantined to a local branch and must never
  # reach a public remote (it embeds a key extracted from Dolby's binary). The
  # .gitignore keeps it from being staged; this makes doubly sure by failing if
  # the directory ever appears in a tracked tree on main/develop.
  no-quarantine:
    name: No Quarantine On Main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert src/quarantine is absent
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch src/quarantine >/dev/null 2>&1; then
            echo "::error::src/quarantine is tracked here; it must never leave its local branch."
            exit 1
          fi
          echo "No quarantined signer in the tree."

  # Classify the change so a docs-only edit skips a five-platform matrix. This
  # is a job rather than a workflow-level paths-ignore on purpose: a filtered-out
  # workflow never runs, so the required "CI Status" check below would sit
  # pending forever and block the PR. Gating the heavy job instead keeps the
  # gate reporting. Conservative - anything not clearly docs counts as code.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Classify changed files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          docs_re='^(docs/|LICENSE$|mkdocs\.yml$|requirements-docs\.txt$|\.github/workflows/docs\.yml$|.*\.md$)'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          else
            before='${{ github.event.before }}'
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              files=$(gh api "repos/$REPO/commits/${{ github.sha }}" --jq '.files[].filename')
            else
              files=$(gh api "repos/$REPO/compare/$before...${{ github.sha }}" --jq '.files[].filename')
            fi
          fi

          # No file list (a manual dispatch, an API hiccup) means build, not skip.
          if [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No file list available; assuming code changed."
            exit 0
          fi

          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! echo "$f" | grep -qE "$docs_re"; then
              echo "  code: $f"
              code=true
            fi
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  # The no-#ifdef rule. Cheap, fast, and deliberately ungated by `changes` so a
  # violation is reported even while the porting legs are still red.
  platform-macros:
    name: Platform Macros
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for preprocessor conditionals in src/
        shell: pwsh
        run: ./scripts/check-platform-macros.ps1 -Root $PWD

  # .clang-tidy's own header comment explains the curated check groups and
  # what got excluded from them (and why). A full Build precedes clang-tidy,
  # not just Configure: CMake 3.28's Ninja dependency-scan step (the
  # "Generating CXX dyndep file" lines in a normal build log) writes a
  # per-TU .modmap response file that compile_commands.json's command lines
  # reference, and nothing generates it until ninja actually runs - clang-tidy
  # fails with "no such file or directory" on every TU without this step, even
  # though it is only reading the AST, not linking anything.
  # -warnings-as-errors='*' makes any finding in the curated set fail the job
  # (run-clang-tidy-21 is the LLVM Python wrapper and takes single-dash
  # arguments, unlike clang-tidy itself): every finding present when this job
  # was added was either fixed or suppressed with a NOLINT and a one-line
  # justification (see the commit that added this job), so a clean baseline
  # is the starting point, not an aspiration.
  static-analysis:
    name: Static Analysis (clang-tidy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM 21
        run: bash .github/toolchain/03-llvm-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: "eaca4a577b6b678c6e10252754b6988a61746c19"

      - name: Configure
        shell: bash
        run: cmake --preset config-linux-llvm

      - name: Build
        shell: bash
        run: cmake --build --preset build-linux-llvm -- -k 0

      - name: clang-tidy
        shell: bash
        run: |
          run-clang-tidy-21 -j "$(nproc)" -p build/config-linux-llvm \
            -warnings-as-errors='*' \
            'src/(lib|cli|matroska)/.*\.cpp'

  build-and-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_build.yml

  # Branch protection points at this one check rather than at each matrix leg,
  # so adding or renaming a leg does not need the protection rule updated.
  # Experimental legs cannot reach it: continue-on-error means the reusable
  # workflow reports success even when one of them fails.
  ci-status:
    name: CI Status
    if: always()
    needs: [ branch-name, no-quarantine, changes, platform-macros, static-analysis, build-and-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Gate on required job results
        shell: bash
        env:
          # 'skipped' on a push (no PR head to name), which is a pass.
          R_BRANCH: ${{ needs.branch-name.result }}
          R_QUARANTINE: ${{ needs.no-quarantine.result }}
          R_CHANGES: ${{ needs.changes.result }}
          R_MACROS: ${{ needs.platform-macros.result }}
          # 'skipped' on a docs-only change, which is a pass, not a failure.
          R_TIDY: ${{ needs.static-analysis.result }}
          R_BUILD: ${{ needs.build-and-test.result }}
        run: |
          set -euo pipefail
          fail=0
          for pair in "branch-name:$R_BRANCH" "no-quarantine:$R_QUARANTINE" \
                      "changes:$R_CHANGES" "platform-macros:$R_MACROS" \
                      "static-analysis:$R_TIDY" "build-and-test:$R_BUILD"; do
            job="${pair%%:*}"; result="${pair#*:}"
            echo "  $job: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$job reported '$result'."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "CI failed - see the failing job(s) above."
            exit 1
          fi
          echo "All required CI jobs passed or were skipped."
