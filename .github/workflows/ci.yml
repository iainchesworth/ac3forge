# ac3forge CI.
#
# ---------------------------------------------------------------------------
# Matrix status (updated when linux-gcc/linux-llvm picked up the GUI, merged
# with the ALSA audio backend that landed on develop in the meantime)
# ---------------------------------------------------------------------------
# linux-gcc and linux-llvm were run for real by this merge itself: fresh
# configure + build + full ctest on WSL2 Ubuntu 26.04 (gcc 15.2.0 / clang
# 21.1.8) with both the GUI and ALSA present together - the exact package list
# _build.yml now installs (qt6-base-dev/-tools, qt6-declarative-dev/-tools,
# libasound2-dev) - plus the same leg's no-ALSA-fallback step, plus the
# headless `ac3gui --smoke` command _build.yml runs after Test. None of that
# has gone through an actual GitHub Actions run yet, since this is the first
# push combining the GUI and ALSA work; rows marked GREEN* should be read as
# "confirmed on WSL2, pending this branch's first real CI run" until that run
# lands. windows-msvc/windows-llvm's 256/256 and linux-llvm-asan-ubsan's
# 270/270 are carried over from before this merge (MSVC 14.51 locally, and the
# commit that landed the ALSA backend, respectively) - not re-run here, but
# the 256 baseline is corroborated independently by this merge's own
# no-ALSA-fallback measurement, which landed on the same number.
#
#   leg                     status    notes
#   ----------------------  --------  ------------------------------------------
#   windows-msvc            GREEN     256/256 tests pass
#   windows-llvm             GREEN    256/256 tests pass; fixed a qsizetype-to-int
#                                     narrowing in encoder_controller.cpp that
#                                     -Wconversion rejects under clang-cl (MSVC's
#                                     /W4 has no equivalent check). Not re-run
#                                     for the ALSA change, which touches no
#                                     Windows code - see the note below on why
#                                     the count still moved
#   linux-gcc                GREEN*   270/270 tests incl. GUI and ALSA both,
#                                     plus 256/256 again in the same leg's
#                                     no-ALSA fallback step - see the WSL2 note
#                                     above
#   linux-llvm                GREEN*  270/270 tests incl. GUI and ALSA both -
#                                     see the WSL2 note above
#   linux-llvm-asan-ubsan    GREEN    270/270 tests (as reported when the ALSA
#                                     backend landed; not independently re-run
#                                     for this merge), leak detection on. Still
#                                     CLI-only by design, to keep a Qt kit out
#                                     of the sanitizer leg's install time - see
#                                     _build.yml. The codec-matrix script this
#                                     leg also runs was not re-run either: it
#                                     exercises encode/decode paths, and no
#                                     codec source changed
#   static-analysis (tidy)   GREEN    .clang-tidy's curated set, clean baseline
#   coverage                 GREEN    81.3% line / 72.0% branch over src/lib
#                                     (ac3::forge only), gated at 80%/70% -
#                                     real GitHub Actions run (gcc 15.2.0,
#                                     ubuntu:26.04 container). A prior WSL2
#                                     measurement came back a couple of points
#                                     higher on both axes - close but not
#                                     identical, and this real-CI number is
#                                     the one to trust. See the job's own
#                                     comment for why the gate sits below it
#   macos-llvm               GREEN    256/256 tests pass (real GitHub Actions
#                                     run, not WSL2/local - this project has
#                                     no Mac). First-ever run hit one genuine,
#                                     fully-understood issue (Homebrew's
#                                     unpinned llvm formula flagging Catch2's
#                                     __COUNTER__ under -Wc2y-extensions - see
#                                     cmake/CompilerWarnings.cmake), fixed in
#                                     one commit, then two consecutive clean
#                                     runs. No longer experimental.
#
# ---------------------------------------------------------------------------
# Gold-reference correctness gate (added alongside the macos-llvm promotion)
# ---------------------------------------------------------------------------
# docs/RESEARCH.md's validation pyramid designed L3 (FFmpeg-oracle strict
# decode, every commit) and L4 (perceptual SNR) from the start; neither was
# ever wired into any CI leg until now. scripts/verify-gold-reference.sh
# encodes a fixed checked-in 5.1 WAV (tests/golden/audio/reference_51.wav),
# strict-decodes it with FFmpeg, decodes it with ac3cli's own decoder, and
# asserts they agree via scripts/compare_wav.py's delay-compensated SNR (>=
# 30 dB gate). Runs on every leg except linux-llvm-asan-ubsan (diagnostic-
# only, same reasoning as its `packageable` exclusion). Real numbers from the
# CI run that landed this: 67.84/67.82 dB on Windows and Linux, 61.81/61.82
# dB on macOS - a real, modest cross-compiler floating-point difference
# (Homebrew LLVM's libm vs. glibc's/MSVC's), comfortably clear of the
# threshold on every leg, and exactly why the gate is SNR-based rather than a
# bit-exact bitstream comparison.
#
# GUI does not gate any ctest entry - it only adds the separate ac3gui build
# target - so the true baseline (no ALSA, GUI on or off, doesn't matter) is
# 256/256 everywhere, confirmed directly by this merge's own linux-gcc
# no-ALSA-fallback run. AC3FORGE_WITH_ALSA's tests/platform/alsa/ (see
# tests/CMakeLists.txt) accounts for the 270-256=14 gap on top of that.
#
# What none of this covers: real audio hardware. WSL2 has no sound devices and
# no kernel sound modules, and neither does a GitHub runner, so the ALSA
# backend is verified headless only. See docs/BUILDING.md#linux-audio.
#
# * Confirmed on WSL2, not yet on an actual GitHub Actions run - see the note
#   above. Drop the asterisk once this branch's CI confirms it there too.
#
# macos-llvm is no longer experimental (see _build.yml's own header for how
# that happened) - it blocks like every other leg now, no continue-on-error.
name: CI

on:
  # Only the long-lived branches build on push; the work happens on topic
  # branches whose pull_request run covers them, so a WIP push does not also run
  # the matrix.
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  # PR runs cancel their own superseded pushes (head_ref-keyed, cancel true) -
  # that's the WIP-churn case this exists for. Push runs on main/develop are
  # SHA-keyed instead: every merge gets its own group, so a fast run of merges
  # can never cancel an earlier merge's still-running gold-reference gate and
  # quality-history append (see docs/quality-trend.md) before it finishes.
  # Branch-name-keyed cancellation silently dropped exactly that data in
  # practice - confirmed via `gh run list`, e.g. PR #35's push run was
  # cancelled outright by PR #36 landing a second later.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Enforce the GitFlow branch naming on every PR. A topic branch is
  # <type>/<name> where type is one of feature/release/hotfix/bugfix/support;
  # main and develop are accepted as PR heads so a release-promotion PR
  # (develop -> main) is never blocked, and dependabot/** is accepted because
  # Dependabot's branch names are not configurable. Required on main/develop, so
  # a misnamed branch cannot merge.
  branch-name:
    name: Branch Name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate head branch name
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == "main" ]]; then
            echo "Core branch '$HEAD_REF' - allowed (release promotion)."
            exit 0
          fi
          if [[ "$HEAD_REF" == dependabot/* ]]; then
            echo "Dependabot branch '$HEAD_REF' - allowed (names are not configurable)."
            exit 0
          fi
          pattern='^(feature|release|hotfix|bugfix|support)/[a-z0-9._-]+$'
          if [[ "$HEAD_REF" =~ $pattern ]]; then
            echo "Branch '$HEAD_REF' conforms to <type>/<name>."
            exit 0
          fi
          echo "::error title=Invalid branch name::'$HEAD_REF' must be <type>/<name> where <type> is one of: feature, release, hotfix, bugfix, support (for example feature/eac3-decoder). See CONTRIBUTING.md."
          exit 1

  # The RE-derived EMDF signer is quarantined to a local branch and must never
  # reach a public remote (it embeds a key extracted from Dolby's binary). The
  # .gitignore keeps it from being staged; this makes doubly sure by failing if
  # the directory ever appears in a tracked tree on main/develop.
  no-quarantine:
    name: No Quarantine On Main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert src/quarantine is absent
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch src/quarantine >/dev/null 2>&1; then
            echo "::error::src/quarantine is tracked here; it must never leave its local branch."
            exit 1
          fi
          echo "No quarantined signer in the tree."

  # Classify the change so a docs-only edit skips a five-platform matrix. This
  # is a job rather than a workflow-level paths-ignore on purpose: a filtered-out
  # workflow never runs, so the required "CI Status" check below would sit
  # pending forever and block the PR. Gating the heavy job instead keeps the
  # gate reporting. Conservative - anything not clearly docs counts as code.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Classify changed files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          docs_re='^(docs/|LICENSE$|mkdocs\.yml$|requirements-docs\.txt$|\.github/workflows/docs\.yml$|.*\.md$)'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          else
            before='${{ github.event.before }}'
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              files=$(gh api "repos/$REPO/commits/${{ github.sha }}" --jq '.files[].filename')
            else
              files=$(gh api "repos/$REPO/compare/$before...${{ github.sha }}" --jq '.files[].filename')
            fi
          fi

          # No file list (a manual dispatch, an API hiccup) means build, not skip.
          if [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No file list available; assuming code changed."
            exit 0
          fi

          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! echo "$f" | grep -qE "$docs_re"; then
              echo "  code: $f"
              code=true
            fi
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  # The no-#ifdef rule. Cheap, fast, and deliberately ungated by `changes` so a
  # violation is reported even while the porting legs are still red.
  platform-macros:
    name: Platform Macros
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for preprocessor conditionals in src/
        shell: pwsh
        run: ./scripts/check-platform-macros.ps1 -Root $PWD

  # .clang-tidy's own header comment explains the curated check groups and
  # what got excluded from them (and why). A full Build precedes clang-tidy,
  # not just Configure: CMake 3.28's Ninja dependency-scan step (the
  # "Generating CXX dyndep file" lines in a normal build log) writes a
  # per-TU .modmap response file that compile_commands.json's command lines
  # reference, and nothing generates it until ninja actually runs - clang-tidy
  # fails with "no such file or directory" on every TU without this step, even
  # though it is only reading the AST, not linking anything.
  # -warnings-as-errors='*' makes any finding in the curated set fail the job
  # (run-clang-tidy-21 is the LLVM Python wrapper and takes single-dash
  # arguments, unlike clang-tidy itself): every finding present when this job
  # was added was either fixed or suppressed with a NOLINT and a one-line
  # justification (see the commit that added this job), so a clean baseline
  # is the starting point, not an aspiration.
  static-analysis:
    name: Static Analysis (clang-tidy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM 21
        run: bash .github/toolchain/03-llvm-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: "eaca4a577b6b678c6e10252754b6988a61746c19"

      - name: Configure
        shell: bash
        run: cmake --preset config-linux-llvm

      - name: Build
        shell: bash
        run: cmake --build --preset build-linux-llvm -- -k 0

      - name: clang-tidy
        shell: bash
        run: |
          run-clang-tidy-21 -j "$(nproc)" -p build/config-linux-llvm \
            -warnings-as-errors='*' \
            'src/(lib|cli|matroska)/.*\.cpp'

  # ac3tests coverage over ac3::forge (src/lib only - the library is what was
  # asked for; src/cli, src/gui and src/matroska are out of scope and unmeasured).
  # config-linux-gcc-coverage (CMakePresets.json) builds just the library and
  # its test suite - AC3FORGE_BUILD_CLI/EXAMPLES are off there specifically so
  # ac3cli and the seven example executables, which also link the now-instrumented
  # ac3::forge, don't need ac3::coverage wired into them too just to resolve its
  # gcov runtime symbols at link time (see cmake/Coverage.cmake).
  #
  # --fail-under-line 80 / --fail-under-branch 70 are deliberately NOT the
  # 80/80 gate a sibling project (CountdownSolver) uses for the same setup:
  # this job's own first real GitHub Actions run (gcc 15.2.0, matching the
  # linux-gcc leg's pin) came back 81.3% line / 72.0% branch, and block
  # switching, delta bit allocation, half sample rate and dual mono support
  # are all landing on this project right now (see docs/RESEARCH.md's own
  # status). Both thresholds sit a few points under that measured baseline on
  # purpose, so ordinary in-flight churn does not immediately trip the gate,
  # while a real coverage regression still fails the job. Raise both as the
  # suite's own coverage grows rather than leaving the headroom in place
  # indefinitely.
  #
  # A pre-merge WSL2 measurement on the same toolchain pin came back a couple
  # of points higher on both axes (close, not identical - environment-
  # specific gcov/header-instantiation differences are expected); the real
  # hosted run above is the number this gate is actually calibrated against.
  coverage:
    name: Coverage (Linux, GCC)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg libasound2-dev lsb-release \
            ninja-build pkg-config python3-pip software-properties-common tar unzip wget zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC 15
        run: bash .github/toolchain/02-gcc-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: "eaca4a577b6b678c6e10252754b6988a61746c19"

      # ubuntu:26.04's python3-pip enforces PEP 668 (no bare `pip install` at
      # system scope) - --break-system-packages is safe here specifically
      # because this container is thrown away at the end of the job, unlike a
      # real machine where that flag risks the system's own Python tooling.
      - name: Install gcovr
        run: pip install --quiet --break-system-packages gcovr

      - name: Configure
        shell: bash
        run: cmake --preset config-linux-gcc-coverage

      - name: Build
        shell: bash
        run: cmake --build --preset build-linux-gcc-coverage -- -k 0

      - name: Test
        shell: bash
        run: ctest --preset test-linux-gcc-coverage

      - name: Coverage report + gate
        shell: bash
        run: >
          gcovr --root . --filter 'src/lib/.*'
          --gcov-executable gcov-15
          --exclude-throw-branches --exclude-unreachable-branches
          --gcov-ignore-errors=no_working_dir_found
          --object-directory build/config-linux-gcc-coverage
          --print-summary --html-details build/coverage.html
          --fail-under-line 80 --fail-under-branch 70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/coverage*.html

  build-and-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_build.yml
    # contents: write is only actually used by _build.yml's quality-trend job
    # (persist_quality_trend gates it to direct develop/main pushes below);
    # every other job in that reusable workflow keeps the workflow-level
    # `contents: read` it already declares - a callee job's own `permissions:`
    # can only narrow what the caller grants here, never widen it, so this is
    # the one place that ceiling has to be raised.
    permissions:
      contents: write
    with:
      # Computed here, not inside _build.yml: github.event_name/github.ref
      # reflect the reusable workflow's own call context once inside it, and
      # this caller site is the unambiguous place to ask "is this a direct
      # push to develop or main" - see persist_quality_trend's own
      # description in _build.yml.
      persist_quality_trend: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
      quality_trend_branch: ${{ github.ref_name }}

  # FFmpeg as an independent oracle (CONTRIBUTING.md's "Oracles" list, #2),
  # automated - previously a manual/developer-only practice. Builds ac3cli
  # only (linux-llvm preset; no GUI, and build-and-test already covers
  # ctest), then runs three layers against it, all against FFmpeg and all
  # already exiting non-zero on their own failure - this job's only new work
  # is wiring them up, pinning FFmpeg, and gating on the result. Answers a
  # different question from _build.yml's gold-reference gate (every leg,
  # one fixed sample, ac3cli's own decoder vs FFmpeg's - output *quality* and
  # cross-platform reproducibility): this leg checks that every layout,
  # Annex E tool token and metadata option in the encoder's surface produces
  # a structurally valid stream at all - output *correctness* across the
  # full option space, which one fixed sample can never exercise:
  #   - conformance: scripts/run-codec-matrix.sh's FFmpeg strict-decode
  #     additions, across the layout/tool/metadata matrix. Skips 7.1.4 and
  #     7.1.4+Annex-E-tool combinations on purpose - see the script's own
  #     header comment and README.md's Verification gaps table for why no
  #     oracle exists for either.
  #   - metadata: tools/check_drc.py (dynrng/compr/downmix/dialnorm) and
  #     tools/check_coupling.py + check_coupling_level.py (coupling envelope
  #     and absolute level), all discriminating checks that compare a decode
  #     which applies the metadata against one that doesn't.
  #   - fidelity: tools/quality_race.py's `ci` mode, a numeric SNR/LSD floor
  #     per E-AC-3 tool variant (stereo and 5.1) plus AC-3, set well below
  #     today's measured numbers (README.md's own SNR table) so it trips on
  #     a genuine regression without chasing normal drift.
  #   - coverage: tools/check_matrix_coverage.py, a different question from
  #     the three layers above - not "is the output correct" but "does
  #     anything exercise this at all". Reads the CLI's own canonical option
  #     lists (usage text, and the "unknown layout"/"unknown tool set" error
  #     messages a bad argument hits) and fails if a layout, Annex E tool
  #     token or command the CLI accepts today is never mentioned in
  #     run-codec-matrix.sh - so a new option landing in the library without
  #     a matching matrix entry fails CI instead of shipping unvalidated.
  #     Caught exactly this for real while this job was being built: E-AC-3
  #     VBR support landed with zero matrix coverage, on this same branch.
  # FFmpeg is pinned to the exact ubuntu:26.04 archive build so its behaviour
  # cannot silently drift out from under the codec-matrix decodes or the
  # fidelity floors above - the same discipline this project already applies
  # to the vcpkg commit and the LLVM/GCC versions.
  ffmpeg-validate:
    name: FFmpeg Validate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Bootstrap container
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config python3-pip software-properties-common \
            tar unzip wget zip \
            ffmpeg=7:8.0.1-3ubuntu2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM 21
        run: bash .github/toolchain/03-llvm-toolchain.sh

      - uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: "eaca4a577b6b678c6e10252754b6988a61746c19"

      - name: Install numpy
        run: pip install --quiet --break-system-packages numpy

      - name: Report ffmpeg version
        run: ffmpeg -version | head -1

      - name: Configure
        run: cmake --preset config-linux-llvm

      - name: Build ac3cli
        run: cmake --build --preset build-linux-llvm --target ac3cli -- -k 0

      - name: Codec matrix against the FFmpeg oracle
        run: bash scripts/run-codec-matrix.sh build/config-linux-llvm/bin/ac3cli

      - name: Metadata checks against FFmpeg (dynrng, compr, downmix, dialnorm)
        run: python3 tools/check_drc.py --cli build/config-linux-llvm/bin/ac3cli

      - name: Coupling checks against FFmpeg (envelope and absolute level)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: |
          python3 tools/check_coupling.py
          python3 tools/check_coupling_level.py

      - name: Fidelity gate against FFmpeg (SNR/LSD floors)
        env:
          AC3CLI: build/config-linux-llvm/bin/ac3cli
        run: python3 tools/quality_race.py ci

      - name: Matrix coverage (every CLI option is exercised somewhere)
        run: python3 tools/check_matrix_coverage.py --cli build/config-linux-llvm/bin/ac3cli

  # Branch protection points at this one check rather than at each matrix leg,
  # so adding or renaming a leg does not need the protection rule updated.
  # Experimental legs cannot reach it: continue-on-error means the reusable
  # workflow reports success even when one of them fails.
  ci-status:
    name: CI Status
    if: always()
    needs: [ branch-name, no-quarantine, changes, platform-macros, static-analysis, coverage, build-and-test, ffmpeg-validate ]
    runs-on: ubuntu-latest
    steps:
      - name: Gate on required job results
        shell: bash
        env:
          # 'skipped' on a push (no PR head to name), which is a pass.
          R_BRANCH: ${{ needs.branch-name.result }}
          R_QUARANTINE: ${{ needs.no-quarantine.result }}
          R_CHANGES: ${{ needs.changes.result }}
          R_MACROS: ${{ needs.platform-macros.result }}
          # 'skipped' on a docs-only change, which is a pass, not a failure.
          R_TIDY: ${{ needs.static-analysis.result }}
          R_COVERAGE: ${{ needs.coverage.result }}
          R_BUILD: ${{ needs.build-and-test.result }}
          R_FFMPEG: ${{ needs.ffmpeg-validate.result }}
        run: |
          set -euo pipefail
          fail=0
          for pair in "branch-name:$R_BRANCH" "no-quarantine:$R_QUARANTINE" \
                      "changes:$R_CHANGES" "platform-macros:$R_MACROS" \
                      "static-analysis:$R_TIDY" "coverage:$R_COVERAGE" \
                      "build-and-test:$R_BUILD" "ffmpeg-validate:$R_FFMPEG"; do
            job="${pair%%:*}"; result="${pair#*:}"
            echo "  $job: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$job reported '$result'."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "CI failed - see the failing job(s) above."
            exit 1
          fi
          echo "All required CI jobs passed or were skipped."
