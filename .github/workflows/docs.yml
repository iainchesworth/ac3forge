name: Docs

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.in"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # Root files the site includes verbatim via pymdownx.snippets
      # (docs/contributing.md and docs/roadmap.md) - an edit to either must
      # rebuild the site or the published copy goes stale.
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      # The WASM decode demo the deploy job below rebuilds fresh and embeds
      # at docs/wasm-demo.md - without these, a platform/wasm/ change on
      # main would never trigger a redeploy at all, and the published demo
      # would silently drift from source. src/forge/ is deliberately NOT
      # listed: an ordinary codec change touches it constantly and has no
      # reason to redeploy the docs site on its own; a change that also
      # needs the demo republished goes through platform/wasm/ (or one of
      # the paths below) too.
      - "platform/wasm/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/toolchains/wasm.emscripten.toolchain.cmake"
      - ".github/actions/setup-emscripten/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.in"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      - "platform/wasm/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/toolchains/wasm.emscripten.toolchain.cmake"
      - ".github/actions/setup-emscripten/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build (--strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - run: pip install --require-hashes -r requirements-docs.txt

      # docs/assets/wasm-decode-demo/ is a committed fallback for a local `mkdocs build` (and
      # this job's own strict build below) - see the deploy job's "Rebuild WASM decode demo"
      # step for why the *published* site never depends on this staying in sync. But
      # index.html/demo.js/the favicons have no reason to differ from platform/wasm/ at all -
      # they are plain copies (see platform/wasm/CMakeLists.txt's POST_BUILD step), not
      # Emscripten output, so nothing here needs the toolchain this job deliberately doesn't
      # install. ac3forge_decode.js/.wasm are the genuine build artifacts and have no
      # source-tree counterpart to diff against, so they're not part of this check.
      - name: Check WASM demo fallback is in sync with platform/wasm/
        run: |
          set -euo pipefail
          status=0
          for f in index.html demo.js favicon.svg favicon-32.png assets/demo.ec3; do
            if ! cmp -s "platform/wasm/$f" "docs/assets/wasm-decode-demo/$f"; then
              echo "::error file=docs/assets/wasm-decode-demo/$f::Out of sync with platform/wasm/$f - re-copy it (see docs/platforms/wasm.md)."
              status=1
            fi
          done
          exit "$status"

      - run: mkdocs build --strict

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # persist-credentials: false - mkdocs gh-deploy below pushes to the
      # gh-pages branch through its own explicitly-scoped remote instead (see
      # "Configure git for gh-deploy"), mirroring _build.yml's quality-trend
      # job. Leaving actions/checkout's token persisted in this working
      # tree's git config for the whole job would just be an unused,
      # avoidable credential sitting around.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - run: pip install --require-hashes -r requirements-docs.txt

      # Rebuilds the WASM decode demo (platform/wasm, roadmap F3) fresh and
      # overwrites the committed docs/assets/wasm-decode-demo/ copy before
      # `mkdocs gh-deploy` runs its own `mkdocs build` internally - so what
      # actually gets published always reflects current source, not
      # whatever happened to be committed. The committed copy stays in the
      # tree as a working fallback for local `mkdocs build` (and this job's
      # own `build` dependency above, which never installs Emscripten) - see
      # docs/wasm-demo.md and docs/platforms/wasm.md for the full reasoning.
      # ninja-build isn't assumed present on this job's runner the way
      # _build.yml's Linux legs can assume it (this workflow never otherwise
      # touches a C++ toolchain), so it's installed explicitly here rather
      # than trusted.
      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build

      - uses: ./.github/actions/setup-emscripten

      - name: Rebuild WASM decode demo
        run: |
          set -euo pipefail
          cmake --preset config-wasm-emscripten
          cmake --build build/config-wasm-emscripten
          rm -rf docs/assets/wasm-decode-demo
          mkdir -p docs/assets/wasm-decode-demo
          cp -r build/config-wasm-emscripten/bin/wasm_decode_demo/. docs/assets/wasm-decode-demo/

      - name: Configure git for gh-deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

      - run: mkdocs gh-deploy --force --clean
