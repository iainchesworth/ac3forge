# OpenSSF Scorecard: supply-chain security health score (pinned deps, branch
# protection, SAST presence, etc.) for the published repo - runs against
# 'main' only, not every branch, since it's assessing the repo's public
# posture rather than gating individual PRs. Visible-only: results are a
# score/badge, not a pass/fail check. Modelled on CountdownSolver's
# .github/workflows/scorecard.yml.
#
# The branch-protection sub-check needs read access to repo settings to score
# fully; without a token it degrades gracefully rather than failing. To get
# the fuller score, add a fine-grained PAT (read-only, "Administration: read")
# as a repo secret named SCORECARD_READ_TOKEN and uncomment repo_token below.
name: Scorecard

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to v2.4.3's underlying commit, not its annotated tag object's
      # own SHA (a different git object - `git cat-file -t` on the old pin
      # returns `tag`, not `commit`). scorecard-action's own publish step
      # checks that the SHA invoking it is a real commit reachable in
      # ossf/scorecard-action, so the tag-object SHA failed with "imposter
      # commit... does not belong to ossf/scorecard-action" on every run -
      # nothing to do with this repo's Scorecard registration.
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Falls back to github.token (read-only, no branch-protection access)
          # when the PAT secret isn't set - repo_token's own default is
          # github.token, but an explicit empty string (an unset secret)
          # overrides that default rather than triggering it, so the fallback
          # has to be spelled out here instead of relying on the action's own.
          repo_token: ${{ secrets.SCORECARD_READ_TOKEN || github.token }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
          category: scorecard
